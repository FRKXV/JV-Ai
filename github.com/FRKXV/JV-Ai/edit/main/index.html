<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>V×J · Team AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:#080808;color:#ddd;font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:15px;}
#app{display:flex;height:100vh;}
.sidebar{width:188px;background:#050505;border-right:1px solid #1a1a1a;display:flex;flex-direction:column;flex-shrink:0;}
.main{flex:1;overflow:hidden;}
.sb-head{padding:13px 11px;border-bottom:1px solid #1a1a1a;}
.sb-logo{font-size:.95rem;font-weight:500;letter-spacing:.08em;}
.lv{color:#5b9bd5}.lx{color:#222;margin:0 2px}.lj{color:#d4a24c}
.sb-sub{font-family:'Courier New',monospace;font-size:.55rem;color:#444;letter-spacing:.06em;margin-top:2px;}
.sb-nav{padding:5px;flex:1;overflow-y:auto;}
.nav-btn{width:100%;display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:6px;border:none;background:transparent;color:#666;font-size:.77rem;text-align:left;cursor:pointer;transition:background .12s,color .12s;font-family:inherit;margin-bottom:1px;}
.nav-btn:hover{color:#bbb}.nav-btn.active{background:#0e0e0e;color:#ddd;}
.nav-ic{font-size:.67rem;width:13px;text-align:center;flex-shrink:0;}
.sb-sect{margin:7px 5px 2px;border-top:1px solid #1a1a1a;padding-top:5px;}
.sb-lbl{display:block;font-family:'Courier New',monospace;font-size:.54rem;color:#3a3a3a;padding:0 3px;margin-bottom:3px;letter-spacing:.07em;}
.pj-btn{width:100%;display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:5px;border:none;background:transparent;color:#555;font-size:.72rem;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;font-family:inherit;margin-bottom:1px;}
.pj-btn:hover{color:#bbb}.pj-btn.active{background:#0e0e0e;color:#ccc;}
.pj-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.pj-nm{overflow:hidden;text-overflow:ellipsis;flex:1;}
.sb-foot{padding:7px 8px;border-top:1px solid #1a1a1a;}
.reset-lnk{background:none;border:none;color:#333;font-size:.58rem;cursor:pointer;font-family:'Courier New',monospace;letter-spacing:.05em;}
.reset-lnk:hover{color:#888}
/* Setup */
.setup-wrap{display:flex;align-items:center;justify-content:center;height:100vh;padding:2rem;}
.setup-box{max-width:410px;width:100%;}
.setup-logo{text-align:center;margin-bottom:1.5rem;}
.setup-big{font-size:2.4rem;font-weight:300;letter-spacing:.3em;}
.setup-tag{font-family:'Courier New',monospace;font-size:.65rem;color:#444;margin-top:4px;}
.setup-desc{color:#555;font-size:.8rem;margin-top:.7rem;line-height:1.65;text-align:center;}
.f-lbl{display:block;font-family:'Courier New',monospace;font-size:.6rem;margin-bottom:4px;letter-spacing:.06em;}
.key-inp{width:100%;padding:10px 12px;border-radius:7px;color:#ddd;font-size:.83rem;font-family:'Courier New',monospace;}
.v-inp{background:#0a1520;border:1px solid #5b9bd533;}
.j-inp{background:#1a1200;border:1px solid #d4a24c33;}
.btn-prim{width:100%;padding:11px;border-radius:7px;border:none;background:linear-gradient(135deg,#1a3f6a,#6a3a10);color:#fff;font-size:.86rem;font-weight:500;cursor:pointer;margin-top:6px;font-family:inherit;}
.btn-prim:disabled{opacity:.4;cursor:not-allowed;}
.setup-note{text-align:center;color:#3a3a3a;font-size:.6rem;margin-top:11px;line-height:1.5;}
/* Dashboard */
.dash{height:100%;overflow-y:auto;padding:18px;}
.pg-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:9px;}
.pg-title{font-size:1.08rem;font-weight:500;margin-bottom:2px;}
.pg-sub{font-family:'Courier New',monospace;font-size:.6rem;color:#444;}
.btn-row{display:flex;gap:6px;}
.btn-ghost{padding:6px 11px;border-radius:6px;border:1px solid #222;background:transparent;color:#777;font-size:.76rem;cursor:pointer;font-family:inherit;transition:all .13s;}
.btn-ghost:hover{color:#ccc;border-color:#333}
.btn-acc{padding:6px 11px;border-radius:6px;border:none;background:linear-gradient(135deg,#1a3f6a,#6a3a10);color:#fff;font-size:.76rem;cursor:pointer;font-family:inherit;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;}
.stat{padding:9px;background:#0e0e0e;border:1px solid #1a1a1a;border-radius:8px;text-align:center;}
.stat-v{font-size:1.25rem;font-weight:300;font-family:'Courier New',monospace;}
.stat-l{font-family:'Courier New',monospace;font-size:.56rem;color:#444;margin-top:2px;}
.gmem{margin-bottom:14px;padding:11px;background:#0e0e0e;border:1px solid #1a1a1a;border-radius:8px;}
.s-lbl{display:block;font-family:'Courier New',monospace;font-size:.58rem;color:#444;letter-spacing:.06em;margin-bottom:6px;}
.ta{width:100%;background:transparent;border:none;color:#ddd;font-size:.8rem;resize:vertical;line-height:1.65;font-family:inherit;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:7px;}
.pcard{padding:11px;background:#0e0e0e;border:1px solid #1a1a1a;border-radius:8px;cursor:pointer;transition:border-color .13s;}
.pcard:hover{border-color:#252525}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:7px;margin-bottom:5px;}
.pc-name{font-weight:500;font-size:.86rem;line-height:1.3;}
.tag{display:inline-block;padding:2px 6px;border-radius:20px;font-family:'Courier New',monospace;font-size:.58rem;letter-spacing:.05em;}
.pc-desc{color:#777;font-size:.74rem;line-height:1.5;margin-bottom:4px;}
.pc-next{font-size:.73rem;color:#888;padding-left:7px;border-left:2px solid #222;margin-bottom:4px;}
.pc-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;}
.mn{font-family:'Courier New',monospace;font-size:.58rem;}
.empty{text-align:center;padding:40px;color:#333;}
/* Section box */
.sec{background:#0e0e0e;border:1px solid #1a1a1a;border-radius:8px;padding:11px;margin-bottom:7px;}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.btn-sm{padding:3px 7px;border-radius:5px;border:1px solid #222;background:transparent;color:#777;font-size:.65rem;cursor:pointer;font-family:inherit;}
.btn-sm:hover{color:#ccc}
/* Project detail */
.pdet{height:100%;overflow-y:auto;padding:18px;}
.det-hd{display:flex;align-items:center;gap:9px;margin-bottom:18px;flex-wrap:wrap;}
.back{background:none;border:none;color:#555;font-size:1.05rem;cursor:pointer;padding:0 3px;flex-shrink:0;}
.nm-inp{flex:1;background:transparent;border:none;color:#ddd;font-size:1.05rem;font-weight:500;font-family:inherit;min-width:80px;}
.st-sel{background:#0e0e0e;border:1px solid #222;color:#ddd;padding:5px 7px;border-radius:6px;font-size:.76rem;cursor:pointer;font-family:inherit;}
.il-row{display:flex;gap:5px;margin-bottom:7px;}
.il-inp{flex:1;padding:7px 9px;background:#141414;border:1px solid #222;border-radius:5px;color:#ddd;font-size:.8rem;font-family:inherit;}
.btn-ok{padding:6px 11px;border-radius:5px;border:none;background:#1a3f6a;color:#fff;font-size:.76rem;cursor:pointer;font-family:inherit;}
.t-row{display:flex;align-items:center;gap:6px;padding:3px 0;}
.t-chk{width:14px;height:14px;border-radius:3px;border:1.5px solid #2a2a2a;background:transparent;flex-shrink:0;cursor:pointer;transition:all .13s;}
.t-chk.done{background:#5b9bd5;border-color:#5b9bd5}
.t-ttl{flex:1;font-size:.8rem;}
.t-ttl.done{text-decoration:line-through;color:#444}
.t-pri{background:transparent;border:none;font-size:.6rem;cursor:pointer;font-family:'Courier New',monospace;}
.rm{background:none;border:none;color:#3a3a3a;cursor:pointer;font-size:.8rem;padding:0 2px;}
.rm:hover{color:#888}
.blk-row{display:flex;align-items:center;gap:6px;}
.blk-ic{color:#d47a7a;font-size:.7rem;flex-shrink:0;}
.blk-tx{flex:1;font-size:.8rem;color:#c87a7a;}
.tgl-row{display:flex;align-items:center;gap:7px;}
.tgl{width:28px;height:16px;border-radius:8px;cursor:pointer;position:relative;transition:all .2s;flex-shrink:0;border:1px solid;}
.tgl-k{width:10px;height:10px;border-radius:50%;position:absolute;top:2px;transition:all .2s;}
.dec{padding:7px 9px;background:#0a0a0a;border-radius:6px;border-left:2px solid #5bd58a33;display:flex;gap:7px;align-items:flex-start;margin-bottom:5px;}
.dec-c{flex:1;font-size:.8rem;margin-bottom:3px;}
.btn-danger{padding:5px 11px;border-radius:6px;border:1px solid #4a1a1a;background:transparent;color:#d47a7a;font-size:.76rem;cursor:pointer;font-family:inherit;}
/* Workspace */
.ws{display:flex;flex-direction:column;height:100%;}
.ws-top{padding:7px 11px;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;gap:5px;flex-wrap:wrap;flex-shrink:0;}
.mode-btn{padding:4px 9px;border-radius:20px;border:1px solid #1a1a1a;background:transparent;color:#555;font-size:.68rem;cursor:pointer;font-family:'Courier New',monospace;transition:all .13s;}
.mode-btn.active{border-color:#252525;background:#0e0e0e;color:#ddd}
.ctx-lbl{font-family:'Courier New',monospace;font-size:.58rem;color:#444;}
.ctx-btn{padding:3px 6px;border-radius:4px;font-size:.58rem;cursor:pointer;font-family:'Courier New',monospace;border:1px solid #1a1a1a;background:transparent;color:#444;transition:all .13s;}
.ctx-btn.active{border-color:#5bd58a33;background:#06120e;color:#5bd58a}
.ws-msgs{flex:1;overflow-y:auto;padding:11px 13px 5px;}
.ws-empty{text-align:center;padding:45px 0 20px;color:#2a2a2a;}
.ws-logo{font-size:1.7rem;font-weight:300;letter-spacing:.3em;margin-bottom:6px;}
.bbl-wrap{display:flex;flex-direction:column;margin-bottom:13px;animation:fadeUp .3s ease forwards;opacity:0;}
.bbl-wrap.right{align-items:flex-end}
.bbl-role{font-family:'Courier New',monospace;font-size:.56rem;margin-bottom:3px;letter-spacing:.05em;}
.bbl{max-width:88%;padding:9px 11px;font-size:.82rem;line-height:1.68;white-space:pre-wrap;color:#d5d5d5;}
.bbl.user{border-radius:10px 10px 3px 10px;background:#111;border:1px solid #1e1e1e}
.bbl.virgilio{border-radius:3px 10px 10px 10px;background:linear-gradient(135deg,#09182a,#0b1e32);border:1px solid #1a3f6a}
.bbl.jarvis{border-radius:3px 10px 10px 10px;background:linear-gradient(135deg,#180e00,#201200);border:1px solid #6a3a0a}
.bbl.synthesis{border-radius:3px 10px 10px 10px;background:linear-gradient(135deg,#061410,#091a12);border:1px solid #0a5a28}
.typing{display:flex;align-items:center;gap:6px;margin-bottom:9px;}
.dots{display:flex;gap:4px;}
.dot{width:5px;height:5px;border-radius:50%;}
.ws-bar{padding:9px 11px;border-top:1px solid #1a1a1a;flex-shrink:0;}
.ws-inner{display:flex;gap:5px;background:#0e0e0e;border:1px solid #222;border-radius:10px;padding:6px 6px 6px 11px;align-items:flex-end;}
.ws-ta{flex:1;background:transparent;border:none;color:#ddd;font-size:.84rem;resize:none;line-height:1.55;font-family:inherit;}
.ws-send{width:33px;height:33px;border-radius:7px;border:none;color:#fff;flex-shrink:0;font-size:.9rem;cursor:pointer;transition:all .13s;}
.ws-send:disabled{background:#181818;color:#3a3a3a;cursor:not-allowed}
.ws-send:not(:disabled){background:linear-gradient(135deg,#1a3f6a,#6a3a10)}
.save-row{display:flex;align-items:center;gap:5px;margin-top:4px;}
.save-sel{background:#0e0e0e;border:1px solid #1e1e1e;color:#777;font-size:.66rem;border-radius:4px;padding:2px 5px;font-family:inherit;}
.sep{flex:1}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes dot{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt=d=>new Date(d).toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'2-digit'});
const $=id=>document.getElementById(id);
const on=(id,ev,fn)=>{const e=$(id);if(e)e.addEventListener(ev,fn);};

const S={
  get:(k,d=null)=>{try{const v=localStorage.getItem('vtj_'+k);return v!==null?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem('vtj_'+k,JSON.stringify(v));}catch{}},
  del:(k)=>{try{localStorage.removeItem('vtj_'+k);}catch{}},
};

const SC={active:'#5b9bd5',blocked:'#d47a7a',completed:'#555',planned:'#d4a24c'};
const SL={active:'Attivo',blocked:'Bloccato',completed:'Completato',planned:'Pianificato'};
const PC={high:'#d47a7a',medium:'#d4a24c',low:'#555'};
const DEF_MEM='Alessandro è un imprenditore sardo, chef a Riyadh. Lavora su e-commerce, food business e progetti di crescita. Virgilio è il collaboratore analitico-strutturale, Jarvis quello strategico-visionario. Output sempre in italiano, diretto e actionable.';

const st={
  view: S.get('vKey')?'dashboard':'setup',
  projects: S.get('projects',[]),
  gm: S.get('globalMemory',DEF_MEM),
  addTask:false, addBlocker:false, addDecision:false,
  sidebarOpen:true,
  ws:{mode:'parallel',ctx:[],msgs:[],loading:false,lr:null,err:''},
};

const getP=id=>st.projects.find(p=>p.id===id);
const saveP=()=>S.set('projects',st.projects);

// ── API ──────────────────────────────────────────────────
const buildSys=(role,ctx)=>{
  const b=role==='virgilio'
    ?'Sei Virgilio, collaboratore AI di Alessandro (imprenditore sardo, chef a Riyadh). Ruolo: analisi tecnica, ricerca, struttura critica, output concreto. Italiano. Diretto. Niente emoji.'
    :'Sei Jarvis, collaboratore AI di Alessandro. Ruolo: strategia, visione, continuità storica dei progetti, decisioni finali. Italiano. Visionario ma pragmatico. Niente emoji. Aggiungi valore, non ripetere.';
  return ctx?`${b}\n\nCONTESTO ATTIVO:\n${ctx}`:b;
};
async function callV(sys,msgs){
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':S.get('vKey'),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:1400,system:sys,messages:msgs}),
  });
  const d=await r.json();
  if(d.error)throw new Error('Virgilio: '+d.error.message);
  return d.content?.map(b=>b.text||'').join('')||'';
}
async function callJ(sys,msgs){
  const r=await fetch('https://api.openai.com/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.get('jKey')},
    body:JSON.stringify({model:'gpt-4o',max_tokens:1400,messages:[{role:'system',content:sys},...msgs]}),
  });
  const d=await r.json();
  if(d.error)throw new Error('Jarvis: '+d.error.message);
  return d.choices?.[0]?.message?.content||'';
}
function buildCtx(){
  const parts=[];
  if(st.gm.trim())parts.push('[MEMORIA GLOBALE]\n'+st.gm.trim());
  const sh=st.projects.filter(p=>st.ws.ctx.includes(p.id)&&p.memory);
  if(sh.length)parts.push('[PROGETTI NEL CONTESTO]\n'+sh.map(p=>`— ${p.name} [${SL[p.status]||p.status}]\n${p.memory}`).join('\n\n'));
  return parts.join('\n\n---\n\n');
}

// ── Render core ──────────────────────────────────────────
function render(){
  const app=$('app'); if(!app)return;
  if(st.view==='setup'){app.innerHTML=rSetup();aSetup();return;}
  const sbStyle=st.sidebarOpen?'width:188px':'width:36px;overflow:hidden';
  app.innerHTML=`<div class="sidebar" id="sb" style="${sbStyle}">${rSidebar()}</div><div class="main" id="mc"></div>`;
  renderMain();
}
function renderMain(){
  const mc=$('mc'); if(!mc)return;
  if(st.view==='dashboard'){mc.innerHTML=rDash();aDash();}
  else if(st.view==='workspace'){mc.innerHTML=rWs();aWs();}
  else if(st.view.startsWith('project:')){
    const p=getP(st.view.slice(8));
    if(p){mc.innerHTML=rDet(p);aDet(p.id);}else nav('dashboard');
  }
}
function nav(v){st.view=v;st.addTask=st.addBlocker=st.addDecision=false;render();}
function rSb(){const sb=document.querySelector('.sidebar');if(sb){sb.innerHTML=rSidebar();sb.style.width=st.sidebarOpen?'188px':'36px';}}
window.togSidebar=()=>{st.sidebarOpen=!st.sidebarOpen;render();};

// ── Setup ────────────────────────────────────────────────
function rSetup(){return`<div class="setup-wrap"><div class="setup-box">
<div class="setup-logo">
<div class="setup-big"><span class="lv">V</span><span class="lx">×</span><span class="lj">J</span></div>
<div class="setup-tag">Team AI Personale · v1</div>
<p class="setup-desc">Inserisci le API key per attivare la collaborazione.<br>Salvate solo nel tuo browser — niente server.</p>
</div>
<div style="display:flex;flex-direction:column;gap:10px;margin-top:1.4rem">
<div><span class="f-lbl" style="color:#5b9bd5">VIRGILIO — Anthropic API Key</span>
<input id="vi" type="password" class="key-inp v-inp" placeholder="sk-ant-..."></div>
<div><span class="f-lbl" style="color:#d4a24c">JARVIS — OpenAI API Key</span>
<input id="ji" type="password" class="key-inp j-inp" placeholder="sk-..."></div>
<button id="sb" class="btn-prim" disabled>Attiva il Team AI →</button>
</div>
<p class="setup-note">Le chiavi restano solo nel tuo browser. Nessun server.</p>
</div></div>`;}
function aSetup(){
  const vi=$('vi'),ji=$('ji'),sb=$('sb');
  const chk=()=>{sb.disabled=!(vi.value.startsWith('sk-ant')&&ji.value.startsWith('sk-'));};
  vi.addEventListener('input',chk); ji.addEventListener('input',chk);
  ji.addEventListener('keydown',e=>{if(e.key==='Enter'&&!sb.disabled)doSetup();});
  sb.addEventListener('click',doSetup);
  function doSetup(){S.set('vKey',vi.value.trim());S.set('jKey',ji.value.trim());nav('dashboard');}
}

// ── Sidebar ──────────────────────────────────────────────
function rSidebar(){
  const v=st.view;
  const pj=st.projects.map(p=>`<button class="pj-btn${v==='project:'+p.id?' active':''}" onclick="nav('project:${p.id}')"><div class="pj-dot" style="background:${SC[p.status]||'#555'}"></div><span class="pj-nm">${esc(p.name)}</span></button>`).join('');
  return`<div class="sb-head" style="display:flex;align-items:center;justify-content:space-between;">
<div style="display:${st.sidebarOpen?'block':'none'}"><div class="sb-logo"><span class="lv">V</span><span class="lx">×</span><span class="lj">J</span></div><div class="sb-sub">Team AI Personale</div></div>
<button onclick="togSidebar()" style="background:none;border:none;color:#555;font-size:.9rem;cursor:pointer;padding:2px 4px;flex-shrink:0;">${st.sidebarOpen?'◁':'▷'}</button>
</div>
<nav class="sb-nav">
<button class="nav-btn${v==='dashboard'?' active':''}" onclick="nav('dashboard')"><span class="nav-ic">◉</span>Dashboard</button>
<button class="nav-btn${v==='workspace'?' active':''}" onclick="nav('workspace')"><span class="nav-ic">⚡</span>Workspace</button>
${st.projects.length?`<div class="sb-sect"><span class="sb-lbl">PROGETTI</span>${pj}</div>`:''}
</nav>
<div class="sb-foot"><button class="reset-lnk" onclick="resetKeys()">reset keys</button></div>`;
}

// ── Dashboard ────────────────────────────────────────────
function rDash(){
  const ps=st.projects,active=ps.filter(p=>p.status==='active').length,blocked=ps.filter(p=>p.status==='blocked').length;
  const pending=ps.flatMap(p=>p.tasks||[]).filter(t=>t.status!=='done').length;
  const cards=ps.length?ps.map(p=>{
    const pt=(p.tasks||[]).filter(t=>t.status!=='done').length;
    return`<div class="pcard" onclick="nav('project:${p.id}')">
<div class="pc-top"><div class="pc-name">${esc(p.name)}</div><span class="tag" style="border-color:${SC[p.status]||'#555'}44;color:${SC[p.status]||'#555'}">${SL[p.status]||p.status}</span></div>
${p.description?`<div class="pc-desc">${esc(p.description.slice(0,78))}${p.description.length>78?'…':''}</div>`:''}
${p.nextAction?`<div class="pc-next">→ ${esc(p.nextAction.slice(0,63))}${p.nextAction.length>63?'…':''}</div>`:''}
<div class="pc-meta">${pt?`<span class="mn" style="color:#444">${pt} task</span>`:''} ${(p.blockers||[]).length?`<span class="mn" style="color:#d47a7a">⚠ ${p.blockers.length}</span>`:''} ${p.shareMemory?`<span class="mn" style="color:#5bd58a">↗ mem</span>`:''}<span class="sep"></span><span class="mn" style="color:#333">${fmt(p.createdAt)}</span></div>
</div>`;}).join(''):`<div class="empty" style="font-family:'Courier New',monospace;font-size:.72rem">Nessun progetto. Inizia con "+ Progetto".</div>`;
  return`<div class="dash">
<div class="pg-hd"><div><div class="pg-title">Dashboard</div><div class="pg-sub">${active} attivi · ${blocked} bloccati · ${pending} task aperti</div></div>
<div class="btn-row"><button class="btn-ghost" onclick="nav('workspace')">⚡ Workspace</button><button class="btn-acc" onclick="newProject()">+ Progetto</button></div></div>
<div class="stats">
<div class="stat"><div class="stat-v" style="color:#5b9bd5">${ps.length}</div><div class="stat-l">Progetti</div></div>
<div class="stat"><div class="stat-v" style="color:#5b9bd5">${active}</div><div class="stat-l">Attivi</div></div>
<div class="stat"><div class="stat-v" style="color:#d47a7a">${blocked}</div><div class="stat-l">Bloccati</div></div>
<div class="stat"><div class="stat-v" style="color:#d4a24c">${pending}</div><div class="stat-l">Task aperti</div></div>
</div>
<div class="gmem"><span class="s-lbl" style="color:#5bd58a">MEMORIA GLOBALE · sempre condivisa</span>
<textarea class="ta" id="gm-ta" rows="3" placeholder="Chi è Alessandro, obiettivi, regole del team AI...">${esc(st.gm)}</textarea></div>
<div class="grid">${cards}</div>
</div>`;
}
function aDash(){on('gm-ta','input',e=>{st.gm=e.target.value;S.set('globalMemory',e.target.value);});}

// ── Project Detail ────────────────────────────────────────
function rDet(p){
  const tasks=p.tasks||[],blk=p.blockers||[],dec=p.decisions||[];
  const pend=tasks.filter(t=>t.status!=='done'),done=tasks.filter(t=>t.status==='done');
  const tRows=tasks.map(t=>`<div class="t-row">
<div class="t-chk${t.status==='done'?' done':''}" onclick="toggleTask('${p.id}','${t.id}')"></div>
<span class="t-ttl${t.status==='done'?' done':''}">${esc(t.title)}</span>
<select class="t-pri" style="color:${PC[t.priority]||'#888'}" onchange="setTPri('${p.id}','${t.id}',this.value)">
<option value="high"${t.priority==='high'?' selected':''}>alta</option>
<option value="medium"${t.priority==='medium'?' selected':''}>media</option>
<option value="low"${t.priority==='low'?' selected':''}>bassa</option>
</select>
<button class="rm" onclick="rmTask('${p.id}','${t.id}')">×</button></div>`).join('');
  const bRows=blk.map((b,i)=>`<div class="blk-row"><span class="blk-ic">⚠</span><span class="blk-tx">${esc(b)}</span><button class="rm" onclick="rmBlk('${p.id}',${i})">×</button></div>`).join('');
  const dRows=[...dec].reverse().map(d=>`<div class="dec"><div style="flex:1"><div class="dec-c">${esc(d.content)}</div><span style="font-family:'Courier New',monospace;font-size:.58rem;color:#444">${fmt(d.date)}</span></div><button class="rm" onclick="rmDec('${p.id}','${d.id}')">×</button></div>`).join('');
  const ts=p.shareMemory?'background:#0d2e18;border-color:#5bd58a44':'background:#111;border-color:#1e1e1e';
  const ks=p.shareMemory?'left:14px;background:#5bd58a':'left:2px;background:#444';
  return`<div class="pdet">
<div class="det-hd">
<button class="back" onclick="nav('dashboard')">←</button>
<input class="nm-inp" id="nm-i" value="${esc(p.name)}" placeholder="Nome progetto">
<select class="st-sel" id="st-s">
<option value="active"${p.status==='active'?' selected':''}>Attivo</option>
<option value="blocked"${p.status==='blocked'?' selected':''}>Bloccato</option>
<option value="completed"${p.status==='completed'?' selected':''}>Completato</option>
<option value="planned"${p.status==='planned'?' selected':''}>Pianificato</option>
</select>
<button class="btn-ghost" style="font-size:.7rem;padding:5px 8px" onclick="openWsFor('${p.id}')">⚡ Workspace</button>
</div>
<div class="sec"><div class="sec-hd"><span class="s-lbl">DESCRIZIONE</span></div>
<textarea class="ta" id="desc-ta" rows="2" placeholder="Cos'è questo progetto?">${esc(p.description||'')}</textarea></div>
<div class="sec"><div class="sec-hd"><span class="s-lbl">PROSSIMA AZIONE</span></div>
<input class="ta" id="next-i" value="${esc(p.nextAction||'')}" placeholder="Cosa fare subito?"></div>
<div class="sec"><div class="sec-hd">
<span class="s-lbl">TASK — ${pend.length} aperti${done.length?`, ${done.length} chiusi`:''}</span>
<button class="btn-sm" onclick="togAddTask('${p.id}')">+ aggiungi</button></div>
${st.addTask?`<div class="il-row"><input class="il-inp" id="nt-i" placeholder="Titolo task..."><button class="btn-ok" onclick="doAddTask('${p.id}')">OK</button></div>`:'' }
${tasks.length?tRows:`<span style="font-family:'Courier New',monospace;font-size:.7rem;color:#444">Nessun task</span>`}
</div>
<div class="sec"><div class="sec-hd">
<span class="s-lbl">BLOCCHI — ${blk.length}</span>
<button class="btn-sm" onclick="togAddBlk('${p.id}')">+ aggiungi</button></div>
${st.addBlocker?`<div class="il-row"><input class="il-inp" id="nb-i" placeholder="Descrivi il blocco..."><button class="btn-ok" onclick="doAddBlk('${p.id}')">OK</button></div>`:'' }
${blk.length?bRows:`<span style="font-family:'Courier New',monospace;font-size:.7rem;color:#444">Nessun blocco</span>`}
</div>
<div class="sec"><div class="sec-hd">
<span class="s-lbl">MEMORIA PROGETTO</span>
<div class="tgl-row">
<span style="font-family:'Courier New',monospace;font-size:.58rem;color:${p.shareMemory?'#5bd58a':'#444'}">${p.shareMemory?'condivisa':'non condivisa'}</span>
<div class="tgl" style="${ts}" onclick="togMem('${p.id}')"><div class="tgl-k" style="${ks}"></div></div>
</div></div>
<textarea class="ta" id="mem-ta" rows="4" placeholder="Riassunto operativo: stato, vincoli, decisioni chiave...">${esc(p.memory||'')}</textarea>
</div>
<div class="sec"><div class="sec-hd">
<span class="s-lbl">DECISIONI — ${dec.length}</span>
<button class="btn-sm" onclick="togAddDec('${p.id}')">+ registra</button></div>
${st.addDecision?`<div class="il-row"><input class="il-inp" id="nd-i" placeholder="Decisione presa..."><button class="btn-ok" onclick="doAddDec('${p.id}')">OK</button></div>`:'' }
${dec.length?dRows:`<span style="font-family:'Courier New',monospace;font-size:.7rem;color:#444">Nessuna decisione registrata</span>`}
</div>
<div style="display:flex;justify-content:flex-end;padding:3px 0 10px">
<button class="btn-danger" onclick="delProject('${p.id}')">Elimina progetto</button>
</div></div>`;
}
function aDet(pid){
  on('nm-i','input',e=>upP(pid,{name:e.target.value}));
  on('desc-ta','input',e=>upP(pid,{description:e.target.value}));
  on('next-i','input',e=>upP(pid,{nextAction:e.target.value}));
  on('mem-ta','input',e=>upP(pid,{memory:e.target.value}));
  on('st-s','change',e=>{upP(pid,{status:e.target.value});rSb();});
  on('nt-i','keydown',e=>{if(e.key==='Enter')doAddTask(pid);});
  on('nb-i','keydown',e=>{if(e.key==='Enter')doAddBlk(pid);});
  on('nd-i','keydown',e=>{if(e.key==='Enter')doAddDec(pid);});
  const af=$('nt-i')||$('nb-i')||$('nd-i');if(af)af.focus();
}
function upP(id,u){const p=getP(id);if(!p)return;Object.assign(p,u,{updatedAt:new Date().toISOString()});saveP();}
function reDet(){const mc=$('mc');if(!mc||!st.view.startsWith('project:'))return;const p=getP(st.view.slice(8));if(p){mc.innerHTML=rDet(p);aDet(p.id);}}

// Project actions
window.nav=nav;
window.newProject=()=>{const n=prompt('Nome del progetto:');if(!n||!n.trim())return;const p={id:uid(),name:n.trim(),description:'',status:'active',nextAction:'',blockers:[],tasks:[],decisions:[],memory:'',shareMemory:false,createdAt:new Date().toISOString()};st.projects.push(p);saveP();nav('project:'+p.id);};
window.delProject=id=>{if(!confirm('Eliminare il progetto?'))return;st.projects=st.projects.filter(p=>p.id!==id);saveP();nav('dashboard');};
window.togAddTask=()=>{st.addTask=!st.addTask;st.addBlocker=st.addDecision=false;reDet();};
window.togAddBlk=()=>{st.addBlocker=!st.addBlocker;st.addTask=st.addDecision=false;reDet();};
window.togAddDec=()=>{st.addDecision=!st.addDecision;st.addTask=st.addBlocker=false;reDet();};
window.doAddTask=pid=>{const i=$('nt-i');if(!i||!i.value.trim())return;const p=getP(pid);if(!p)return;p.tasks=[...(p.tasks||[]),{id:uid(),title:i.value.trim(),status:'todo',priority:'medium'}];saveP();st.addTask=false;reDet();};
window.doAddBlk=pid=>{const i=$('nb-i');if(!i||!i.value.trim())return;const p=getP(pid);if(!p)return;p.blockers=[...(p.blockers||[]),i.value.trim()];saveP();st.addBlocker=false;reDet();};
window.doAddDec=pid=>{const i=$('nd-i');if(!i||!i.value.trim())return;const p=getP(pid);if(!p)return;p.decisions=[...(p.decisions||[]),{id:uid(),content:i.value.trim(),date:new Date().toISOString()}];saveP();st.addDecision=false;reDet();};
window.toggleTask=(pid,tid)=>{const p=getP(pid);if(!p)return;const t=p.tasks.find(t=>t.id===tid);if(!t)return;t.status=t.status==='done'?'todo':'done';saveP();reDet();};
window.setTPri=(pid,tid,v)=>{const p=getP(pid);if(!p)return;const t=p.tasks.find(t=>t.id===tid);if(!t)return;t.priority=v;saveP();};
window.rmTask=(pid,tid)=>{const p=getP(pid);if(!p)return;p.tasks=p.tasks.filter(t=>t.id!==tid);saveP();reDet();};
window.rmBlk=(pid,i)=>{const p=getP(pid);if(!p)return;p.blockers.splice(i,1);saveP();reDet();};
window.rmDec=(pid,did)=>{const p=getP(pid);if(!p)return;p.decisions=p.decisions.filter(d=>d.id!==did);saveP();reDet();};
window.togMem=pid=>{const p=getP(pid);if(!p)return;p.shareMemory=!p.shareMemory;saveP();reDet();};
window.openWsFor=pid=>{if(!st.ws.ctx.includes(pid))st.ws.ctx.push(pid);nav('workspace');};
window.resetKeys=()=>{if(!confirm('Resettare le API key?'))return;S.del('vKey');S.del('jKey');nav('setup');};

// ── Workspace ─────────────────────────────────────────────
const MODES=[{id:'sequential',ic:'⟶',lb:'Sequenziale'},{id:'debate',ic:'⚡',lb:'Dibattito'},{id:'parallel',ic:'⫿',lb:'Parallelo'},{id:'shortlist',ic:'◈',lb:'Shortlist'}];

function rWs(){
  const ws=st.ws;
  const mBtns=MODES.map(m=>`<button class="mode-btn${ws.mode===m.id?' active':''}" onclick="setWsMode('${m.id}')">${m.ic} ${m.lb}</button>`).join('');
  const refreshBtn=`<button onclick="clearWs()" style="background:none;border:1px solid #1a1a1a;color:#444;font-size:.65rem;padding:3px 7px;border-radius:5px;cursor:pointer;font-family:'Courier New',monospace;margin-left:4px;" title="Pulisci chat">↺ clear</button>`;
  const cBtns=st.projects.map(p=>`<button class="ctx-btn${ws.ctx.includes(p.id)?' active':''}" onclick="togCtx('${p.id}')">${esc(p.name.slice(0,9))}</button>`).join('');
  const msgs=ws.msgs.map(rMsg).join('');
  const empty=!ws.msgs.length?`<div class="ws-empty"><div class="ws-logo"><span style="color:#5b9bd5">V</span><span style="color:#1a1a1a">×</span><span style="color:#d4a24c">J</span></div><span style="font-family:'Courier New',monospace;font-size:.7rem;color:#2a2a2a">Inserisci un task per avviare la collaborazione</span>${ws.ctx.length?`<br><br><span style="font-family:'Courier New',monospace;font-size:.6rem;color:#5bd58a">↗ ${ws.ctx.length} progett${ws.ctx.length===1?'o':'i'} nel contesto</span>`:''}</div>`:'';
  return`<div class="ws">
<div class="ws-top">${mBtns}${refreshBtn}<span class="sep"></span><span class="ctx-lbl">CTX:</span>${cBtns||'<span style="font-family:Courier New,monospace;font-size:.56rem;color:#333">nessun progetto</span>'}</div>
<div class="ws-msgs" id="wm">${empty}${msgs}${ws.loading&&ws.lr==='both'?rTyp('virgilio')+rTyp('jarvis'):''}${ws.loading&&ws.lr&&ws.lr!=='both'?rTyp(ws.lr):''}${ws.err?`<div style="color:#d47a7a;font-size:.74rem;padding:5px 0;font-family:Courier New,monospace">${esc(ws.err)}</div>`:''}</div>
<div class="ws-bar"><div class="ws-inner">
<textarea class="ws-ta" id="ws-ta" rows="2" placeholder="Task, domanda, analisi... (Invio = invia · Shift+Invio = a capo)"></textarea>
<button class="ws-send" id="ws-snd" ${ws.loading?'disabled':''}>↑</button>
</div></div></div>`;
}
function rMsg(m){
  const RC={virgilio:'#5b9bd5',jarvis:'#d4a24c',synthesis:'#5bd58a',user:'#777'};
  const RL={virgilio:'Virgilio',jarvis:'Jarvis',synthesis:'Sintesi',user:'Alessandro'};
  const saveR=m.role==='synthesis'?`<div class="save-row"><span style="font-family:'Courier New',monospace;font-size:.56rem;color:#444">Salva in:</span>
<select class="save-sel" onchange="saveToP(this.value,'${m.id}')"><option value="">-- progetto --</option>${st.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>`:'';
  return`<div class="bbl-wrap${m.role==='user'?' right':''}" style="opacity:1;animation:none">
<div class="bbl-role" style="color:${RC[m.role]||'#777'}">${RL[m.role]||m.role}</div>
<div class="bbl ${m.role}">${esc(m.content)}</div>${saveR}</div>`;
}
function rTyp(role){
  const c=role==='virgilio'?'#5b9bd5':'#d4a24c';
  return`<div class="typing"><span style="font-family:'Courier New',monospace;font-size:.56rem;color:${c}">${role==='virgilio'?'Virgilio':'Jarvis'}</span><div class="dots"><div class="dot" style="background:${c};animation:dot 1.2s 0s infinite"></div><div class="dot" style="background:${c};animation:dot 1.2s .2s infinite"></div><div class="dot" style="background:${c};animation:dot 1.2s .4s infinite"></div></div></div>`;
}
function aWs(){
  const ta=$('ws-ta'),btn=$('ws-snd');
  if(ta){ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();subWs();}});}
  if(btn)btn.addEventListener('click',subWs);
  scrollWm();
}
function scrollWm(){const w=$('wm');if(w)setTimeout(()=>w.scrollTop=w.scrollHeight,40);}
function appendMsg(role,content){
  const m={role,content,id:uid()};st.ws.msgs.push(m);
  const w=$('wm');if(!w)return;
  w.querySelectorAll('.ws-empty').forEach(e=>e.remove());
  const div=document.createElement('div');div.innerHTML=rMsg(m);
  const node=div.firstElementChild;node.style.opacity='0';node.style.animation='fadeUp .3s ease forwards';
  w.appendChild(node);scrollWm();
}
function updTyp(){
  const w=$('wm');if(!w)return;
  w.querySelectorAll('.typing,[data-wserr]').forEach(e=>e.remove());
  if(st.ws.loading){
    const div=document.createElement('div');
    div.innerHTML=st.ws.lr==='both'?rTyp('virgilio')+rTyp('jarvis'):(st.ws.lr?rTyp(st.ws.lr):'');
    while(div.firstChild)w.appendChild(div.firstChild);
    scrollWm();
  }
  if(st.ws.err){
    const div=document.createElement('div');div.setAttribute('data-wserr','1');
    div.style.cssText='color:#d47a7a;font-size:.74rem;padding:5px 0;font-family:Courier New,monospace';
    div.textContent=st.ws.err;w.appendChild(div);
  }
  const btn=$('ws-snd');if(btn)btn.disabled=st.ws.loading;
}
async function subWs(){
  const ws=st.ws;if(ws.loading)return;
  const ta=$('ws-ta');const input=(ta?.value||'').trim();if(!input)return;
  if(ta)ta.value='';ws.err='';
  appendMsg('user',input);ws.loading=true;
  try{await runWs(input);}catch(e){ws.err=e.message;}
  ws.loading=false;ws.lr=null;updTyp();
}
async function runWs(task){
  const ws=st.ws,ctx=buildCtx();
  if(ws.mode==='sequential'){
    let v1='';
    try{ws.lr='virgilio';updTyp();v1=await callV(buildSys('virgilio',ctx),[{role:'user',content:task}]);appendMsg('virgilio',v1);}
    catch(e){appendMsg('virgilio','[Virgilio non disponibile]');}
    ws.lr='jarvis';updTyp();
    const j1=await callJ(buildSys('jarvis',ctx),[{role:'user',content:v1?`Task: "${task}"\n\nVirgilio:\n${v1}\n\nCritica, integra, aggiungi strategia. Non ripetere.`:task}]);
    appendMsg('jarvis',j1);
    if(v1){try{ws.lr='virgilio';updTyp();const syn=await callV(buildSys('virgilio',ctx),[{role:'user',content:`Task: "${task}"\nVirgilio: ${v1}\nJarvis: ${j1}\n\nSintesi finale: risposta ottimale, concisa, actionable.`}]);appendMsg('synthesis',syn);}catch(e){}}
  }else if(ws.mode==='debate'){
    ws.lr='virgilio';updTyp();
    const v1=await callV(buildSys('virgilio',ctx),[{role:'user',content:`Argomenta una posizione chiara su: "${task}". Sii assertivo.`}]);
    appendMsg('virgilio',v1);
    ws.lr='jarvis';updTyp();
    const j1=await callJ(buildSys('jarvis',ctx),[{role:'user',content:`Su "${task}", Virgilio sostiene:\n${v1}\n\nPrendi la posizione opposta. Confuta.`}]);
    appendMsg('jarvis',j1);
    ws.lr='virgilio';updTyp();
    const v2=await callV(buildSys('virgilio',ctx),[{role:'user',content:`Jarvis risponde:\n${j1}\n\nControreplica finale su "${task}".`}]);
    appendMsg('virgilio',v2);
  }else if(ws.mode==='shortlist'){
    ws.lr='both';updTyp();
    const[v1,j1]=await Promise.all([
      callV(buildSys('virgilio',ctx),[{role:'user',content:`Genera 5-7 idee creative e concrete su: "${task}". Solo lista numerata, breve.`}]),
      callJ(buildSys('jarvis',ctx),[{role:'user',content:`Genera 5-7 idee creative e concrete su: "${task}". Solo lista numerata, breve.`}]),
    ]);
    appendMsg('virgilio',v1);appendMsg('jarvis',j1);
    ws.lr='virgilio';updTyp();
    const sl=await callV(buildSys('virgilio',ctx),[{role:'user',content:`Tema: "${task}"
Idee Virgilio:
${v1}
Idee Jarvis:
${j1}

Seleziona le 3 migliori idee in assoluto. Per ognuna: nome breve, perché è la migliore, un rischio possibile. Formato decisionale chiaro.`}]);
    appendMsg('synthesis',sl);
  }else{
    ws.lr='both';updTyp();
    const[v1,j1]=await Promise.all([callV(buildSys('virgilio',ctx),[{role:'user',content:task}]),callJ(buildSys('jarvis',ctx),[{role:'user',content:task}])]);
    appendMsg('virgilio',v1);appendMsg('jarvis',j1);
  }
}
window.clearWs=()=>{st.ws.msgs=[];st.ws.err='';renderMain();};
window.setWsMode=m=>{st.ws.mode=m;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.textContent.trim().includes(MODES.find(x=>x.id===m)?.lb)));};
window.togCtx=pid=>{const ws=st.ws;ws.ctx=ws.ctx.includes(pid)?ws.ctx.filter(x=>x!==pid):[...ws.ctx,pid];const b=document.querySelector(`[onclick="togCtx('${pid}')"]`);if(b)b.classList.toggle('active',ws.ctx.includes(pid));};
window.saveToP=(pid,mid)=>{if(!pid)return;const p=getP(pid);if(!p)return;const m=st.ws.msgs.find(m=>m.id===mid);if(!m)return;const stamp=new Date().toLocaleDateString('it-IT');p.memory=((p.memory||'').trim()+`\n\n[${stamp}]\n${m.content.slice(0,400)}`).trim();saveP();alert('Salvato in "'+p.name+'"');};

render();
</script>
</body>
</html>
