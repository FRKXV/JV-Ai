<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>V×J · Team AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:#080808;color:#e0e0e0;font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:14px;}
button{cursor:pointer;font-family:inherit;}
textarea,input,select{font-family:inherit;outline:none;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#222;}
#app{display:flex;height:100vh;}
#sidebar{background:#050505;border-right:1px solid #181818;display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden;}
#sidebar.open{width:180px;}
#sidebar.closed{width:34px;}
#main{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.sb-head{padding:10px 8px;border-bottom:1px solid #181818;display:flex;align-items:center;justify-content:space-between;min-height:44px;}
.sb-logo{font-size:.9rem;font-weight:500;white-space:nowrap;}
.lv{color:#5b9bd5}.lx{color:#1e1e1e;margin:0 3px}.lj{color:#d4a24c}
.sb-sub{font-family:'Courier New',monospace;font-size:.5rem;color:#3a3a3a;margin-top:2px;}
.sb-tog{background:none;border:none;color:#444;font-size:.75rem;padding:2px 4px;flex-shrink:0;}
.sb-nav{padding:4px;flex:1;overflow-y:auto;}
.nb{width:100%;display:flex;align-items:center;gap:6px;padding:6px 7px;border-radius:5px;border:none;background:transparent;color:#555;font-size:.73rem;text-align:left;margin-bottom:1px;white-space:nowrap;}
.nb:hover{color:#bbb;background:#0d0d0d}.nb.on{background:#0e0e0e;color:#ddd;}
.nb-ic{font-size:.62rem;width:12px;text-align:center;flex-shrink:0;}
.sb-div{margin:5px 4px 3px;border-top:1px solid #181818;padding-top:4px;}
.sb-lbl{display:block;font-family:'Courier New',monospace;font-size:.5rem;color:#303030;padding:0 3px;margin-bottom:2px;}
.pb{width:100%;display:flex;align-items:center;gap:4px;padding:4px 7px;border-radius:4px;border:none;background:transparent;color:#484848;font-size:.68rem;text-align:left;white-space:nowrap;overflow:hidden;margin-bottom:1px;}
.pb:hover{color:#aaa}.pb.on{background:#0e0e0e;color:#ccc;}
.pdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.pnm{overflow:hidden;text-overflow:ellipsis;flex:1;}
.sb-foot{padding:5px 7px;border-top:1px solid #181818;}
.rl{background:none;border:none;color:#2a2a2a;font-size:.55rem;cursor:pointer;font-family:'Courier New',monospace;}
.rl:hover{color:#777}
.setup{display:flex;align-items:center;justify-content:center;height:100vh;padding:2rem;}
.setup-box{max-width:400px;width:100%;}
.setup-big{font-size:2.2rem;font-weight:300;letter-spacing:.35em;text-align:center;}
.setup-tag{font-family:'Courier New',monospace;font-size:.58rem;color:#3a3a3a;margin-top:5px;text-align:center;display:block;}
.setup-desc{color:#484848;font-size:.76rem;margin-top:.7rem;line-height:1.7;text-align:center;}
.fl{display:block;font-family:'Courier New',monospace;font-size:.57rem;margin-bottom:4px;letter-spacing:.05em;}
.ki{width:100%;padding:9px 11px;border-radius:6px;color:#ddd;font-size:.8rem;font-family:'Courier New',monospace;}
.ki.v{background:#080f1a;border:1px solid #5b9bd522;}
.ki.j{background:#14100a;border:1px solid #d4a24c22;}
.bp{width:100%;padding:10px;border-radius:6px;border:none;background:linear-gradient(135deg,#1a3f6a,#6a3a10);color:#fff;font-size:.84rem;font-weight:500;margin-top:8px;}
.bp:disabled{opacity:.35;cursor:not-allowed;}
.setup-note{text-align:center;color:#2e2e2e;font-size:.57rem;margin-top:10px;line-height:1.5;}
.dash{height:100%;overflow-y:auto;padding:16px;}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.pt{font-size:1rem;font-weight:500;margin-bottom:2px;}
.ps{font-family:'Courier New',monospace;font-size:.57rem;color:#3a3a3a;}
.br{display:flex;gap:5px;}
.bg{padding:5px 10px;border-radius:5px;border:1px solid #1e1e1e;background:transparent;color:#666;font-size:.72rem;}
.bg:hover{color:#ccc;border-color:#2a2a2a}
.ba{padding:5px 10px;border-radius:5px;border:none;background:linear-gradient(135deg,#1a3f6a,#6a3a10);color:#fff;font-size:.72rem;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:12px;}
.stat{padding:8px;background:#0d0d0d;border:1px solid #181818;border-radius:7px;text-align:center;}
.sv{font-size:1.2rem;font-weight:300;font-family:'Courier New',monospace;}
.sl{font-family:'Courier New',monospace;font-size:.52rem;color:#3a3a3a;margin-top:2px;}
.gmem{margin-bottom:12px;padding:10px;background:#0d0d0d;border:1px solid #181818;border-radius:7px;}
.slbl{display:block;font-family:'Courier New',monospace;font-size:.55rem;color:#3a3a3a;letter-spacing:.05em;margin-bottom:5px;}
.ta{width:100%;background:transparent;border:none;color:#ddd;font-size:.78rem;resize:vertical;line-height:1.65;}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;}
.pc{padding:10px;background:#0d0d0d;border:1px solid #181818;border-radius:7px;cursor:pointer;transition:border-color .12s;}
.pc:hover{border-color:#242424}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:4px;}
.pc-nm{font-weight:500;font-size:.83rem;line-height:1.3;}
.tg{display:inline-block;padding:2px 6px;border-radius:20px;font-family:'Courier New',monospace;font-size:.55rem;}
.pc-desc{color:#666;font-size:.71rem;line-height:1.5;margin-bottom:3px;}
.pc-nx{font-size:.7rem;color:#777;padding-left:6px;border-left:2px solid #1e1e1e;margin-bottom:3px;}
.pc-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:3px;}
.mn{font-family:'Courier New',monospace;font-size:.55rem;}
.empty{text-align:center;padding:36px;color:#2a2a2a;font-family:'Courier New',monospace;font-size:.68rem;}
.pdet{height:100%;overflow-y:auto;padding:16px;}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.back{background:none;border:none;color:#484848;font-size:1rem;padding:0 3px;}
.nmi{flex:1;background:transparent;border:none;color:#ddd;font-size:1rem;font-weight:500;min-width:80px;}
.sts{background:#0d0d0d;border:1px solid #1e1e1e;color:#ddd;padding:4px 6px;border-radius:5px;font-size:.73rem;}
.sec{background:#0d0d0d;border:1px solid #181818;border-radius:7px;padding:10px;margin-bottom:6px;}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.bsm{padding:2px 7px;border-radius:4px;border:1px solid #1e1e1e;background:transparent;color:#666;font-size:.62rem;}
.bsm:hover{color:#ccc}
.ilr{display:flex;gap:4px;margin-bottom:6px;}
.ili{flex:1;padding:6px 8px;background:#141414;border:1px solid #1e1e1e;border-radius:5px;color:#ddd;font-size:.76rem;}
.bok{padding:5px 10px;border-radius:5px;border:none;background:#1a3f6a;color:#fff;font-size:.73rem;}
.tr{display:flex;align-items:center;gap:5px;padding:2px 0;}
.chk{width:13px;height:13px;border-radius:3px;border:1.5px solid #252525;background:transparent;flex-shrink:0;cursor:pointer;transition:all .12s;}
.chk.done{background:#5b9bd5;border-color:#5b9bd5}
.ttl{flex:1;font-size:.78rem;}
.ttl.done{text-decoration:line-through;color:#3a3a3a}
.tpri{background:transparent;border:none;font-size:.58rem;cursor:pointer;font-family:'Courier New',monospace;}
.rm{background:none;border:none;color:#2a2a2a;font-size:.78rem;padding:0 2px;}
.rm:hover{color:#777}
.br-row{display:flex;align-items:center;gap:5px;}
.bi{color:#d47a7a;font-size:.68rem;flex-shrink:0;}
.bt{flex:1;font-size:.78rem;color:#c87a7a;}
.tgl-row{display:flex;align-items:center;gap:6px;}
.tgl{width:26px;height:15px;border-radius:8px;cursor:pointer;position:relative;transition:all .2s;flex-shrink:0;border:1px solid;}
.tglk{width:9px;height:9px;border-radius:50%;position:absolute;top:2px;transition:all .2s;}
.dec{padding:6px 8px;background:#0a0a0a;border-radius:5px;border-left:2px solid #5bd58a22;display:flex;gap:6px;align-items:flex-start;margin-bottom:4px;}
.dc{flex:1;font-size:.78rem;margin-bottom:2px;}
.bda{padding:5px 10px;border-radius:5px;border:1px solid #3a1010;background:transparent;color:#d47a7a;font-size:.72rem;}
.ws{display:flex;flex-direction:column;height:100%;}
.wt{padding:6px 10px;border-bottom:1px solid #181818;display:flex;align-items:center;gap:4px;flex-wrap:wrap;flex-shrink:0;}
.mb{padding:3px 8px;border-radius:20px;border:1px solid #181818;background:transparent;color:#484848;font-size:.64rem;font-family:'Courier New',monospace;transition:all .12s;}
.mb.on{border-color:#242424;background:#0e0e0e;color:#ddd;}
.cb{padding:2px 6px;border-radius:4px;font-size:.56rem;cursor:pointer;font-family:'Courier New',monospace;border:1px solid #181818;background:transparent;color:#383838;transition:all .12s;}
.cb.on{border-color:#5bd58a22;background:#060f0a;color:#5bd58a;}
.clr{background:none;border:1px solid #181818;color:#383838;font-size:.6rem;padding:2px 7px;border-radius:4px;font-family:'Courier New',monospace;margin-left:3px;}
.clr:hover{color:#777}
.ctxl{font-family:'Courier New',monospace;font-size:.55rem;color:#303030;}
.sp{flex:1;}
.wm{flex:1;overflow-y:auto;padding:10px 12px 4px;}
.we{text-align:center;padding:40px 0 16px;color:#202020;}
.wlogo{font-size:1.6rem;font-weight:300;letter-spacing:.3em;margin-bottom:5px;}
.wtag{font-family:'Courier New',monospace;font-size:.62rem;}
.bw{display:flex;flex-direction:column;margin-bottom:11px;animation:fu .28s ease forwards;opacity:0;}
.bw.r{align-items:flex-end;}
.brole{font-family:'Courier New',monospace;font-size:.54rem;margin-bottom:2px;}
.bb{max-width:88%;padding:8px 10px;font-size:.8rem;line-height:1.68;white-space:pre-wrap;color:#d0d0d0;}
.bb.user{border-radius:9px 9px 3px 9px;background:#111;border:1px solid #1c1c1c;}
.bb.virgilio{border-radius:3px 9px 9px 9px;background:linear-gradient(135deg,#07151f,#091b2a);border:1px solid #183550;}
.bb.jarvis{border-radius:3px 9px 9px 9px;background:linear-gradient(135deg,#130b00,#1c1000);border:1px solid #503010;}
.bb.synthesis{border-radius:3px 9px 9px 9px;background:linear-gradient(135deg,#050f08,#071410);border:1px solid #0a4020;}
.savr{display:flex;align-items:center;gap:4px;margin-top:3px;}
.savs{background:#0d0d0d;border:1px solid #1a1a1a;color:#666;font-size:.62rem;border-radius:4px;padding:2px 5px;}
.typing{display:flex;align-items:center;gap:5px;margin-bottom:8px;}
.dots{display:flex;gap:3px;}
.dot{width:4px;height:4px;border-radius:50%;}
.err{color:#d47a7a;font-size:.7rem;padding:4px 0;font-family:'Courier New',monospace;}
.wb{padding:8px 10px;border-top:1px solid #181818;flex-shrink:0;}
.wi{display:flex;gap:4px;background:#0d0d0d;border:1px solid #1e1e1e;border-radius:9px;padding:5px 5px 5px 10px;align-items:flex-end;}
.wta{flex:1;background:transparent;border:none;color:#ddd;font-size:.82rem;resize:none;line-height:1.5;}
.wsnd{width:32px;height:32px;border-radius:6px;border:none;color:#fff;flex-shrink:0;font-size:.88rem;transition:background .13s;}
.wsnd:disabled{background:#181818;color:#333;cursor:not-allowed;}
.wsnd:not(:disabled){background:linear-gradient(135deg,#1a3f6a,#6a3a10);}
.img-wrap{margin-top:6px;max-width:88%;}
.img-wrap img{max-width:100%;border-radius:8px;border:1px solid #1e1e1e;display:block;}
.img-btn{display:inline-block;margin-top:5px;padding:3px 8px;border-radius:4px;border:1px solid #1e1e1e;background:transparent;color:#888;font-size:.62rem;text-decoration:none;}
@keyframes fu{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes dp{0%,100%{opacity:.2;transform:scale(.75);}50%{opacity:1;transform:scale(1.25);}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const S={
  get:(k,d=null)=>{try{const v=localStorage.getItem('vtj3_'+k);return v!==null?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem('vtj3_'+k,JSON.stringify(v));}catch{}},
  del:(k)=>{try{localStorage.removeItem('vtj3_'+k);}catch{}},
};
const SC={active:'#5b9bd5',blocked:'#d47a7a',completed:'#484848',planned:'#d4a24c'};
const SL={active:'Attivo',blocked:'Bloccato',completed:'Completato',planned:'Pianificato'};
const PC={high:'#d47a7a',medium:'#d4a24c',low:'#484848'};
const MODES=[
  {id:'sequential',ic:'⟶',lb:'Sequenziale'},
  {id:'debate',ic:'⚡',lb:'Dibattito'},
  {id:'parallel',ic:'⫿',lb:'Parallelo'},
  {id:'shortlist',ic:'◈',lb:'Shortlist'},
];
const DEF_GM='Alessandro è un imprenditore sardo, chef a Riyadh. Lavora su e-commerce, food business e progetti di crescita. Virgilio: analitico e strutturale. Jarvis: strategico e visionario. Risposta sempre in italiano, diretta e actionable.';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt=d=>{try{return new Date(d).toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'2-digit'});}catch{return '';}};
const $=id=>document.getElementById(id);
const on=(id,ev,fn)=>{const e=$(id);if(e)e.addEventListener(ev,fn);};

const st={
  view:S.get('vKey')?'dashboard':'setup',
  projects:S.get('projects',[]),
  gm:S.get('gm',DEF_GM),
  sbOpen:true,
  addTask:false,addBlocker:false,addDecision:false,
  ws:{mode:'parallel',ctx:[],msgs:[],loading:false,lr:null,err:''},
};
const getP=id=>st.projects.find(p=>p.id===id);
const saveP=()=>S.set('projects',st.projects);

// ── API ──────────────────────────────────────────────────
const SYS_V='Sei Virgilio, collaboratore AI di Alessandro (imprenditore sardo, chef a Riyadh). Ruolo: analisi tecnica, ricerca, struttura critica. Italiano. Diretto. Senza emoji.';
const SYS_J='Sei Jarvis, collaboratore AI di Alessandro. Ruolo: strategia, visione, decisioni finali. Italiano. Visionario ma pragmatico. Senza emoji.';

function buildCtx(){
  const parts=[];
  if(st.gm.trim())parts.push('[MEMORIA GLOBALE]\n'+st.gm.trim());
  const sh=st.projects.filter(p=>st.ws.ctx.includes(p.id)&&p.memory);
  if(sh.length)parts.push('[PROGETTI ATTIVI]\n'+sh.map(p=>`— ${p.name} [${SL[p.status]}]\n${p.memory}`).join('\n\n'));
  return parts.join('\n\n---\n\n');
}

async function callV(messages){
  const key=S.get('vKey');
  if(!key)throw new Error('Virgilio: key mancante');
  const ctx=buildCtx();
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:1200,system:SYS_V+(ctx?'\n\nCONTESTO:\n'+ctx:''),messages}),
  });
  const d=await r.json();
  if(d.error)throw new Error('Virgilio: '+d.error.message);
  return d.content?.map(b=>b.text||'').join('')||'';
}

async function callJ(messages){
  const key=S.get('jKey');
  if(!key)throw new Error('Jarvis: key mancante');
  const ctx=buildCtx();
  const r=await fetch('https://api.openai.com/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({model:'gpt-4o',max_tokens:1200,messages:[{role:'system',content:SYS_J+(ctx?'\n\nCONTESTO:\n'+ctx:'')},...messages]}),
  });
  const d=await r.json();
  if(d.error)throw new Error('Jarvis: '+d.error.message);
  return d.choices?.[0]?.message?.content||'';
}

async function callImg(prompt){
  const key=S.get('jKey');
  if(!key)throw new Error('OpenAI key mancante');
  const r=await fetch('https://api.openai.com/v1/images/generations',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({model:'gpt-image-1',prompt,n:1,size:'1024x1024'}),
  });
  const d=await r.json();
  if(d.error)throw new Error('Immagine: '+d.error.message);
  const img=d.data?.[0];
  if(!img)throw new Error('Nessuna immagine ricevuta');
  return img.url?img.url:'data:image/png;base64,'+img.b64_json;
}

// ── Render ───────────────────────────────────────────────
function render(){
  const app=$('app');if(!app)return;
  if(st.view==='setup'){app.innerHTML=rSetup();aSetup();return;}
  app.innerHTML=`<div id="sidebar" class="${st.sbOpen?'open':'closed'}">${rSidebar()}</div><div id="main">${rMain()}</div>`;
  attachMain();
}
function rMain(){
  if(st.view==='dashboard')return rDash();
  if(st.view==='workspace')return rWs();
  if(st.view.startsWith('p:')){const p=getP(st.view.slice(2));return p?rDet(p):rDash();}
  return rDash();
}
function attachMain(){
  if(st.view==='dashboard')aDash();
  else if(st.view==='workspace')aWs();
  else if(st.view.startsWith('p:')){const p=getP(st.view.slice(2));if(p)aDet(p.id);}
}
function nav(v){st.view=v;st.addTask=st.addBlocker=st.addDecision=false;render();}

// ── Setup ────────────────────────────────────────────────
function rSetup(){
  return`<div class="setup"><div class="setup-box">
<div class="setup-big"><span class="lv">V</span><span class="lx">×</span><span class="lj">J</span></div>
<span class="setup-tag">Team AI Personale · v3</span>
<p class="setup-desc">Inserisci le API key per attivare la collaborazione.<br>Salvate solo nel tuo browser.</p>
<div style="display:flex;flex-direction:column;gap:9px;margin-top:1.2rem">
<div><span class="fl" style="color:#5b9bd5">VIRGILIO — Anthropic</span><input id="vi" type="password" class="ki v" placeholder="sk-ant-api03-..."></div>
<div><span class="fl" style="color:#d4a24c">JARVIS — OpenAI</span><input id="ji" type="password" class="ki j" placeholder="sk-proj-..."></div>
<button id="sbtn" class="bp" disabled>Attiva il Team AI →</button>
</div>
<p class="setup-note">Le chiavi restano solo nel browser. Nessun server.</p>
</div></div>`;
}
function aSetup(){
  const vi=$('vi'),ji=$('ji'),btn=$('sbtn');
  const chk=()=>{btn.disabled=!(vi.value.length>20&&ji.value.length>20);};
  vi.addEventListener('input',chk);ji.addEventListener('input',chk);
  btn.addEventListener('click',()=>{S.set('vKey',vi.value.trim());S.set('jKey',ji.value.trim());nav('dashboard');});
}

// ── Sidebar ──────────────────────────────────────────────
function rSidebar(){
  const v=st.view;
  const pjs=st.projects.map(p=>`<button class="pb${v==='p:'+p.id?' on':''}" onclick="nav('p:${p.id}')"><div class="pdot" style="background:${SC[p.status]||'#484848'}"></div><span class="pnm">${esc(p.name)}</span></button>`).join('');
  return`<div class="sb-head">
${st.sbOpen?`<div><div class="sb-logo"><span class="lv">V</span><span class="lx">×</span><span class="lj">J</span></div><div class="sb-sub">Team AI Personale</div></div>`:'<div></div>'}
<button class="sb-tog" onclick="togSb()">${st.sbOpen?'◁':'▷'}</button>
</div>
<nav class="sb-nav">
<button class="nb${v==='dashboard'?' on':''}" onclick="nav('dashboard')"><span class="nb-ic">◉</span>${st.sbOpen?'Dashboard':''}</button>
<button class="nb${v==='workspace'?' on':''}" onclick="nav('workspace')"><span class="nb-ic">⚡</span>${st.sbOpen?'Workspace':''}</button>
${st.projects.length&&st.sbOpen?`<div class="sb-div"><span class="sb-lbl">PROGETTI</span>${pjs}</div>`:''}
</nav>
<div class="sb-foot">${st.sbOpen?`<button class="rl" onclick="doReset()">reset keys</button>`:''}</div>`;
}

// ── Dashboard ────────────────────────────────────────────
function rDash(){
  const ps=st.projects;
  const active=ps.filter(p=>p.status==='active').length;
  const blocked=ps.filter(p=>p.status==='blocked').length;
  const pending=ps.flatMap(p=>p.tasks||[]).filter(t=>t.status!=='done').length;
  const cards=ps.length?ps.map(p=>{
    const pt=(p.tasks||[]).filter(t=>t.status!=='done').length;
    const bl=(p.blockers||[]).length;
    return`<div class="pc" onclick="nav('p:${p.id}')">
<div class="pc-top"><div class="pc-nm">${esc(p.name)}</div><span class="tg" style="border:1px solid ${SC[p.status]||'#484848'}33;color:${SC[p.status]||'#484848'}">${SL[p.status]||p.status}</span></div>
${p.description?`<div class="pc-desc">${esc(p.description.slice(0,75))}${p.description.length>75?'…':''}</div>`:''}
${p.nextAction?`<div class="pc-nx">→ ${esc(p.nextAction.slice(0,60))}${p.nextAction.length>60?'…':''}</div>`:''}
<div class="pc-meta">${pt?`<span class="mn" style="color:#3a3a3a">${pt} task</span>`:''} ${bl?`<span class="mn" style="color:#d47a7a">⚠ ${bl}</span>`:''} ${p.shareMemory?`<span class="mn" style="color:#5bd58a">↗</span>`:''}<span class="mn" style="color:#252525;margin-left:auto">${fmt(p.createdAt)}</span></div>
</div>`;}).join(''):`<div class="empty">Nessun progetto. Inizia con "+ Progetto".</div>`;
  return`<div class="dash">
<div class="ph"><div><div class="pt">Dashboard</div><div class="ps">${active} attivi · ${blocked} bloccati · ${pending} task</div></div>
<div class="br"><button class="bg" onclick="nav('workspace')">⚡ Workspace</button><button class="ba" onclick="newProj()">+ Progetto</button></div></div>
<div class="stats">
<div class="stat"><div class="sv" style="color:#5b9bd5">${ps.length}</div><div class="sl">Progetti</div></div>
<div class="stat"><div class="sv" style="color:#5b9bd5">${active}</div><div class="sl">Attivi</div></div>
<div class="stat"><div class="sv" style="color:#d47a7a">${blocked}</div><div class="sl">Bloccati</div></div>
<div class="stat"><div class="sv" style="color:#d4a24c">${pending}</div><div class="sl">Task</div></div>
</div>
<div class="gmem"><span class="slbl" style="color:#5bd58a">MEMORIA GLOBALE</span><textarea class="ta" id="gm-ta" rows="3" placeholder="Chi è Alessandro, obiettivi, regole...">${esc(st.gm)}</textarea></div>
<div class="pgrid">${cards}</div>
</div>`;
}
function aDash(){on('gm-ta','input',e=>{st.gm=e.target.value;S.set('gm',e.target.value);});}

// ── Project Detail ────────────────────────────────────────
function rDet(p){
  const tasks=p.tasks||[],blk=p.blockers||[],dec=p.decisions||[];
  const pend=tasks.filter(t=>t.status!=='done'),done=tasks.filter(t=>t.status==='done');
  const tRows=tasks.map(t=>`<div class="tr"><div class="chk${t.status==='done'?' done':''}" onclick="togTask('${p.id}','${t.id}')"></div><span class="ttl${t.status==='done'?' done':''}">${esc(t.title)}</span><select class="tpri" style="color:${PC[t.priority]||'#888'}" onchange="setPri('${p.id}','${t.id}',this.value)"><option value="high"${t.priority==='high'?' selected':''}>alta</option><option value="medium"${t.priority==='medium'?' selected':''}>media</option><option value="low"${t.priority==='low'?' selected':''}>bassa</option></select><button class="rm" onclick="rmTask('${p.id}','${t.id}')">×</button></div>`).join('');
  const bRows=blk.map((b,i)=>`<div class="br-row"><span class="bi">⚠</span><span class="bt">${esc(b)}</span><button class="rm" onclick="rmBlk('${p.id}',${i})">×</button></div>`).join('');
  const dRows=[...dec].reverse().map(d=>`<div class="dec"><div style="flex:1"><div class="dc">${esc(d.content)}</div><span style="font-family:'Courier New',monospace;font-size:.55rem;color:#303030">${fmt(d.date)}</span></div><button class="rm" onclick="rmDec('${p.id}','${d.id}')">×</button></div>`).join('');
  const tglBg=p.shareMemory?'background:#060f0a;border-color:#5bd58a33':'background:#0d0d0d;border-color:#181818';
  const tglK=p.shareMemory?'left:13px;background:#5bd58a':'left:2px;background:#383838';
  return`<div class="pdet">
<div class="dh"><button class="back" onclick="nav('dashboard')">←</button><input class="nmi" id="nm-i" value="${esc(p.name)}"><select class="sts" id="st-s"><option value="active"${p.status==='active'?' selected':''}>Attivo</option><option value="blocked"${p.status==='blocked'?' selected':''}>Bloccato</option><option value="completed"${p.status==='completed'?' selected':''}>Completato</option><option value="planned"${p.status==='planned'?' selected':''}>Pianificato</option></select><button class="bg" style="font-size:.65rem;padding:4px 7px" onclick="wsFor('${p.id}')">⚡ WS</button></div>
<div class="sec"><div class="sh"><span class="slbl">DESCRIZIONE</span></div><textarea class="ta" id="desc-ta" rows="2" placeholder="Cos'è questo progetto?">${esc(p.description||'')}</textarea></div>
<div class="sec"><div class="sh"><span class="slbl">PROSSIMA AZIONE</span></div><input class="ta" id="next-i" value="${esc(p.nextAction||'')}" placeholder="Cosa fare subito?"></div>
<div class="sec"><div class="sh"><span class="slbl">TASK — ${pend.length} aperti${done.length?`, ${done.length} chiusi`:''}</span><button class="bsm" onclick="togAddTask('${p.id}')">+ task</button></div>${st.addTask?`<div class="ilr"><input class="ili" id="nt-i" placeholder="Titolo task..."><button class="bok" onclick="doTask('${p.id}')">OK</button></div>`:''} ${tasks.length?tRows:`<span style="font-family:'Courier New',monospace;font-size:.65rem;color:#2a2a2a">Nessun task</span>`}</div>
<div class="sec"><div class="sh"><span class="slbl">BLOCCHI — ${blk.length}</span><button class="bsm" onclick="togAddBlk('${p.id}')">+ blocco</button></div>${st.addBlocker?`<div class="ilr"><input class="ili" id="nb-i" placeholder="Descrivi il blocco..."><button class="bok" onclick="doBlk('${p.id}')">OK</button></div>`:''} ${blk.length?bRows:`<span style="font-family:'Courier New',monospace;font-size:.65rem;color:#2a2a2a">Nessun blocco</span>`}</div>
<div class="sec"><div class="sh"><span class="slbl">MEMORIA</span><div class="tgl-row"><span style="font-family:'Courier New',monospace;font-size:.55rem;color:${p.shareMemory?'#5bd58a':'#303030'}">${p.shareMemory?'condivisa':'non condivisa'}</span><div class="tgl" style="${tglBg}" onclick="togMem('${p.id}')"><div class="tglk" style="${tglK}"></div></div></div></div><textarea class="ta" id="mem-ta" rows="4" placeholder="Riassunto operativo...">${esc(p.memory||'')}</textarea></div>
<div class="sec"><div class="sh"><span class="slbl">DECISIONI — ${dec.length}</span><button class="bsm" onclick="togAddDec('${p.id}')">+ decisione</button></div>${st.addDecision?`<div class="ilr"><input class="ili" id="nd-i" placeholder="Decisione presa..."><button class="bok" onclick="doDec('${p.id}')">OK</button></div>`:''} ${dec.length?dRows:`<span style="font-family:'Courier New',monospace;font-size:.65rem;color:#2a2a2a">Nessuna decisione</span>`}</div>
<div style="display:flex;justify-content:flex-end;padding:4px 0 12px"><button class="bda" onclick="delProj('${p.id}')">Elimina progetto</button></div>
</div>`;
}
function aDet(pid){
  on('nm-i','input',e=>upP(pid,{name:e.target.value}));
  on('desc-ta','input',e=>upP(pid,{description:e.target.value}));
  on('next-i','input',e=>upP(pid,{nextAction:e.target.value}));
  on('mem-ta','input',e=>upP(pid,{memory:e.target.value}));
  on('st-s','change',e=>{upP(pid,{status:e.target.value});const sb=$('sidebar');if(sb)sb.innerHTML=rSidebar();});
  on('nt-i','keydown',e=>{if(e.key==='Enter')doTask(pid);});
  on('nb-i','keydown',e=>{if(e.key==='Enter')doBlk(pid);});
  on('nd-i','keydown',e=>{if(e.key==='Enter')doDec(pid);});
  const af=$('nt-i')||$('nb-i')||$('nd-i');if(af)setTimeout(()=>af.focus(),50);
}
function upP(id,u){const p=getP(id);if(!p)return;Object.assign(p,u,{updatedAt:new Date().toISOString()});saveP();}
function reDet(){const m=$('main');if(!m||!st.view.startsWith('p:'))return;const p=getP(st.view.slice(2));if(p){m.innerHTML=rDet(p);aDet(p.id);}}

// ── Workspace ────────────────────────────────────────────
function rWs(){
  const ws=st.ws;
  const mBtns=MODES.map(m=>`<button class="mb${ws.mode===m.id?' on':''}" onclick="setMode('${m.id}')">${m.ic} ${m.lb}</button>`).join('');
  const cBtns=st.projects.map(p=>`<button class="cb${ws.ctx.includes(p.id)?' on':''}" onclick="togCtx('${p.id}')">${esc(p.name.slice(0,8))}</button>`).join('');
  const msgs=ws.msgs.map((m,i)=>rMsg(m,i===ws.msgs.length-1&&!ws.loading)).join('');
  const empty=!ws.msgs.length?`<div class="we"><div class="wlogo"><span style="color:#5b9bd5">V</span><span style="color:#161616">×</span><span style="color:#d4a24c">J</span></div><div class="wtag">Inserisci un task per avviare la collaborazione</div>${ws.ctx.length?`<div style="margin-top:6px;font-family:'Courier New',monospace;font-size:.55rem;color:#5bd58a">↗ ${ws.ctx.length} progett${ws.ctx.length===1?'o':'i'} nel contesto</div>`:''}</div>`:'';
  return`<div class="ws">
<div class="wt">${mBtns}<button class="clr" onclick="clearWs()">↺ clear</button><button class="clr" onclick="genImg()" style="color:#a07040;border-color:#2a1800">🖼 immagine</button><span class="sp"></span><span class="ctxl">CTX:</span>${cBtns||'<span style="font-family:Courier New,monospace;font-size:.52rem;color:#252525">nessun progetto</span>'}</div>
<div class="wm" id="wm">${empty}${msgs}${ws.loading&&ws.lr==='both'?rTyp('virgilio')+rTyp('jarvis'):''}${ws.loading&&ws.lr&&ws.lr!=='both'?rTyp(ws.lr):''}${ws.err?`<div class="err">${esc(ws.err)}</div>`:''}</div>
<div class="wb"><div class="wi"><textarea class="wta" id="wta" rows="2" placeholder="Task, domanda, analisi... (Invio = invia · Shift+Invio = a capo)"></textarea><button class="wsnd" id="wsnd" ${ws.loading?'disabled':''}>↑</button></div></div>
</div>`;
}
function rMsg(m,animate){
  const RC={virgilio:'#5b9bd5',jarvis:'#d4a24c',synthesis:'#5bd58a',user:'#606060',image:'#a07040'};
  const RL={virgilio:'Virgilio',jarvis:'Jarvis',synthesis:'Sintesi',user:'Alessandro',image:'DALL·E'};
  const anim=animate?'opacity:0;animation:fu .28s ease forwards':'';
  if(m.role==='image'){
    return`<div class="bw" style="${anim}"><div class="brole" style="color:#a07040">DALL·E</div><div class="img-wrap"><img src="${m.content}" alt="immagine generata"><a href="${m.content}" target="_blank" class="img-btn">↗ apri</a></div></div>`;
  }
  const saveHtml=m.role==='synthesis'?`<div class="savr"><span style="font-family:'Courier New',monospace;font-size:.52rem;color:#303030">Salva in:</span><select class="savs" onchange="saveToP(this.value,'${m.id}')"><option value="">-- progetto --</option>${st.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>`:'';
  return`<div class="bw${m.role==='user'?' r':''}" style="${anim}"><div class="brole" style="color:${RC[m.role]||'#606060'}">${RL[m.role]||m.role}</div><div class="bb ${m.role}">${esc(m.content)}</div>${saveHtml}</div>`;
}
function rTyp(role){
  const c=role==='virgilio'?'#5b9bd5':'#d4a24c';
  return`<div class="typing"><span style="font-family:'Courier New',monospace;font-size:.52rem;color:${c}">${role==='virgilio'?'Virgilio':'Jarvis'}</span><div class="dots">${[0,.2,.4].map(d=>`<div class="dot" style="background:${c};animation:dp 1.1s ${d}s infinite"></div>`).join('')}</div></div>`;
}
function aWs(){
  const ta=$('wta'),btn=$('wsnd');
  if(ta)ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitWs();}});
  if(btn)btn.addEventListener('click',submitWs);
  scrollWm();
}
function scrollWm(){const w=$('wm');if(w)setTimeout(()=>w.scrollTop=w.scrollHeight,50);}
function addMsg(role,content){
  const m={role,content,id:uid()};
  st.ws.msgs.push(m);
  const w=$('wm');if(!w)return;
  w.querySelectorAll('.we').forEach(e=>e.remove());
  const div=document.createElement('div');
  div.innerHTML=rMsg(m,true);
  w.appendChild(div.firstElementChild);
  scrollWm();
}
function updUI(){
  const w=$('wm');if(!w)return;
  w.querySelectorAll('.typing,.err').forEach(e=>e.remove());
  if(st.ws.loading){
    const div=document.createElement('div');
    div.innerHTML=st.ws.lr==='both'?rTyp('virgilio')+rTyp('jarvis'):(st.ws.lr?rTyp(st.ws.lr):'');
    while(div.firstChild)w.appendChild(div.firstChild);
    scrollWm();
  }
  if(st.ws.err){const div=document.createElement('div');div.className='err';div.textContent=st.ws.err;w.appendChild(div);scrollWm();}
  const btn=$('wsnd');if(btn)btn.disabled=st.ws.loading;
}
async function submitWs(){
  const ws=st.ws;if(ws.loading)return;
  const ta=$('wta');const input=(ta?.value||'').trim();if(!input)return;
  if(ta)ta.value='';ws.err='';addMsg('user',input);ws.loading=true;
  try{await runWs(input);}catch(e){ws.err=e.message;}
  ws.loading=false;ws.lr=null;updUI();
}
async function runWs(task){
  const ws=st.ws;
  if(ws.mode==='sequential')await runSeq(task);
  else if(ws.mode==='debate')await runDeb(task);
  else if(ws.mode==='shortlist')await runShort(task);
  else await runPar(task);
}
async function runSeq(task){
  const ws=st.ws;let v1='';
  try{ws.lr='virgilio';updUI();v1=await callV([{role:'user',content:task}]);addMsg('virgilio',v1);}
  catch(e){addMsg('virgilio','[Virgilio: '+e.message+']');}
  ws.lr='jarvis';updUI();
  const j1=await callJ([{role:'user',content:v1?`Task: "${task}"\n\nVirgilio:\n${v1}\n\nCritica, integra, non ripetere.`:task}]);
  addMsg('jarvis',j1);
  if(v1){try{ws.lr='virgilio';updUI();const syn=await callV([{role:'user',content:`Task: "${task}"\nVirgilio: ${v1}\nJarvis: ${j1}\n\nSintesi finale concisa e actionable.`}]);addMsg('synthesis',syn);}catch(e){}}
}
async function runDeb(task){
  const ws=st.ws;
  ws.lr='virgilio';updUI();const v1=await callV([{role:'user',content:`Argomenta una posizione chiara su: "${task}". Sii assertivo.`}]);addMsg('virgilio',v1);
  ws.lr='jarvis';updUI();const j1=await callJ([{role:'user',content:`Su "${task}", Virgilio sostiene:\n${v1}\n\nPrendi la posizione opposta. Confuta.`}]);addMsg('jarvis',j1);
  ws.lr='virgilio';updUI();const v2=await callV([{role:'user',content:`Jarvis risponde:\n${j1}\n\nControreplica finale su "${task}".`}]);addMsg('virgilio',v2);
}
async function runPar(task){
  const ws=st.ws;ws.lr='both';updUI();
  const[v1,j1]=await Promise.allSettled([callV([{role:'user',content:task}]),callJ([{role:'user',content:task}])]);
  if(v1.status==='fulfilled')addMsg('virgilio',v1.value);else addMsg('virgilio','[Virgilio: '+v1.reason.message+']');
  if(j1.status==='fulfilled')addMsg('jarvis',j1.value);else addMsg('jarvis','[Jarvis: '+j1.reason.message+']');
}
async function runShort(task){
  const ws=st.ws;ws.lr='both';updUI();
  const[v1,j1]=await Promise.allSettled([
    callV([{role:'user',content:`Genera 5-6 idee concrete su: "${task}". Solo lista numerata, breve.`}]),
    callJ([{role:'user',content:`Genera 5-6 idee concrete su: "${task}". Solo lista numerata, breve.`}]),
  ]);
  const vt=v1.status==='fulfilled'?v1.value:'[Virgilio non disponibile]';
  const jt=j1.status==='fulfilled'?j1.value:'[Jarvis non disponibile]';
  addMsg('virgilio',vt);addMsg('jarvis',jt);
  if(v1.status==='fulfilled'){
    ws.lr='virgilio';updUI();
    const syn=await callV([{role:'user',content:`Tema: "${task}"\nVirgilio:\n${vt}\nJarvis:\n${jt}\n\nSeleziona le 3 migliori. Per ognuna: nome, motivazione, rischio. Formato decisionale.`}]);
    addMsg('synthesis',syn);
  }
}

// ── Global Actions ───────────────────────────────────────
window.nav=nav;
window.togSb=()=>{st.sbOpen=!st.sbOpen;render();};
window.doReset=()=>{if(!confirm('Resettare le API key?'))return;S.del('vKey');S.del('jKey');nav('setup');};
window.newProj=()=>{
  const n=prompt('Nome del progetto:');if(!n||!n.trim())return;
  const p={id:uid(),name:n.trim(),description:'',status:'active',nextAction:'',blockers:[],tasks:[],decisions:[],memory:'',shareMemory:false,createdAt:new Date().toISOString()};
  st.projects.push(p);saveP();nav('p:'+p.id);
};
window.delProj=id=>{if(!confirm('Eliminare?'))return;st.projects=st.projects.filter(p=>p.id!==id);saveP();nav('dashboard');};
window.wsFor=id=>{if(!st.ws.ctx.includes(id))st.ws.ctx.push(id);nav('workspace');};
window.togAddTask=()=>{st.addTask=!st.addTask;st.addBlocker=st.addDecision=false;reDet();};
window.togAddBlk=()=>{st.addBlocker=!st.addBlocker;st.addTask=st.addDecision=false;reDet();};
window.togAddDec=()=>{st.addDecision=!st.addDecision;st.addTask=st.addBlocker=false;reDet();};
window.doTask=pid=>{const i=$('nt-i');if(!i||!i.value.trim())return;const p=getP(pid);if(!p)return;p.tasks=[...(p.tasks||[]),{id:uid(),title:i.value.trim(),status:'todo',priority:'medium'}];saveP();st.addTask=false;reDet();};
window.doBlk=pid=>{const i=$('nb-i');if(!i||!i.value.trim())return;const p=getP(pid);if(!p)return;p.blockers=[...(p.blockers||[]),i.value.trim()];saveP();st.addBlocker=false;reDet();};
window.doDec=pid=>{const i=$('nd-i');if(!i||!i.value.trim())return;const p=getP(pid);if(!p)return;p.decisions=[...(p.decisions||[]),{id:uid(),content:i.value.trim(),date:new Date().toISOString()}];saveP();st.addDecision=false;reDet();};
window.togTask=(pid,tid)=>{const p=getP(pid);if(!p)return;const t=p.tasks.find(t=>t.id===tid);if(!t)return;t.status=t.status==='done'?'todo':'done';saveP();reDet();};
window.setPri=(pid,tid,v)=>{const p=getP(pid);if(!p)return;const t=p.tasks.find(t=>t.id===tid);if(!t)return;t.priority=v;saveP();};
window.rmTask=(pid,tid)=>{const p=getP(pid);if(!p)return;p.tasks=p.tasks.filter(t=>t.id!==tid);saveP();reDet();};
window.rmBlk=(pid,i)=>{const p=getP(pid);if(!p)return;p.blockers.splice(i,1);saveP();reDet();};
window.rmDec=(pid,did)=>{const p=getP(pid);if(!p)return;p.decisions=p.decisions.filter(d=>d.id!==did);saveP();reDet();};
window.togMem=pid=>{const p=getP(pid);if(!p)return;p.shareMemory=!p.shareMemory;saveP();reDet();};
window.setMode=m=>{st.ws.mode=m;document.querySelectorAll('.mb').forEach(b=>b.classList.toggle('on',b.textContent.trim().includes(MODES.find(x=>x.id===m)?.lb)));};
window.togCtx=pid=>{st.ws.ctx=st.ws.ctx.includes(pid)?st.ws.ctx.filter(x=>x!==pid):[...st.ws.ctx,pid];const b=document.querySelector(`[onclick="togCtx('${pid}')"]`);if(b)b.classList.toggle('on',st.ws.ctx.includes(pid));};
window.clearWs=()=>{st.ws.msgs=[];st.ws.err='';const m=$('main');if(m){m.innerHTML=rWs();aWs();}};
window.saveToP=(pid,mid)=>{
  if(!pid)return;const p=getP(pid);if(!p)return;const m=st.ws.msgs.find(m=>m.id===mid);if(!m)return;
  const stamp=new Date().toLocaleDateString('it-IT');
  p.memory=((p.memory||'').trim()+`\n\n[${stamp}]\n${m.content.slice(0,400)}`).trim();
  saveP();alert('Salvato in "'+p.name+'"');
};
window.genImg=()=>{
  const w=$('wm');if(!w)return;
  // toggle inline image input
  const existing=$('img-inp-row');
  if(existing){existing.remove();return;}
  const div=document.createElement('div');
  div.id='img-inp-row';
  div.style.cssText='display:flex;gap:5px;padding:8px 0;';
  div.innerHTML=`<input id="img-brief" placeholder="Descrivi cosa vuoi generare..." style="flex:1;padding:6px 9px;background:#141414;border:1px solid #2a1800;border-radius:6px;color:#ddd;font-size:.8rem;font-family:inherit;"><button onclick="doGenImg()" style="padding:6px 11px;border-radius:6px;border:none;background:linear-gradient(135deg,#6a3a10,#3a1800);color:#fff;font-size:.78rem;cursor:pointer;">Genera</button>`;
  w.insertBefore(div,w.firstChild);
  setTimeout(()=>{const i=$('img-brief');if(i)i.focus();},50);
};
window.doGenImg=async()=>{
  const inp=$('img-brief');
  const brief=inp?inp.value.trim():'';
  if(!brief)return;
  const row=$('img-inp-row');if(row)row.remove();
  const ws=st.ws;
  addMsg('user','[Immagine] '+brief);
  ws.loading=true;ws.lr='jarvis';updUI();
  try{
    const imgPrompt=await callJ([{role:'user',content:'Crea un prompt ottimale per generare questa immagine: "'+brief+'". Rispondi SOLO con il prompt in inglese, max 200 caratteri.'}]);
    ws.lr=null;updUI();ws.loading=true;
    const src=await callImg(imgPrompt);
    addMsg('image',src);
  }catch(e){ws.err=e.message;}
  ws.loading=false;ws.lr=null;updUI();
};

render();
</script>
</body>
